name = "arttoy-mysterybox-ai"
compatibility_date = "2024-11-01"
pages_build_output_dir = "./dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "arttoy-db"
database_id = "58c95db2-e776-49cd-85e8-99417ea3bd42"
migrations_dir = "./migrations"

# Cloudflare KV Storage Binding (replaces R2)
[[kv_namespaces]]
binding = "KV"
id = "7813dc1fb2754b1d9b86b772e0315c40"

# Cloudflare Vectorize (Vector Database) Binding
[[vectorize]]
binding = "VECTORIZE"
index_name = "arttoy-vector-index"

# Environment Variables & AI Gateway settings
[vars]
AI_PERSONA_NAME = "Thầy Phẻo Gieo Quẻ Art Toy"
STORE_NAME = "PHẺO ART TOY - HỘP MÙ PHONG THỦY"
STORE_BANK_ID = "970422" # MB Bank (Military Bank)
STORE_ACCOUNT_NO = "888899998888"
STORE_ACCOUNT_NAME = "TIEM DO CHOI THE PHEO"